services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '3001:3001'
    env_file: .env.production
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://api.gajantraders.com
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=https://api.gajantraders.com
    depends_on:
      - api
    restart: unless-stopped

  customer:
    build:
      context: .
      dockerfile: apps/customer/Dockerfile
    ports:
      - '3002:3002'
    depends_on:
      - api
    restart: unless-stopped
